<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="./g6.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0e1117; font-family: "Source Sans Pro", sans-serif; color: #e6e6e6; }
  #root { display: flex; flex-direction: column; }
  #toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; align-items: center; background: #11151c; border-bottom: 1px solid #262a34; }
  .g6-search {
    flex: 1 1 200px; min-width: 160px; padding: 6px 10px; border-radius: 6px; border: 1px solid #363b47;
    background: #1c212c; color: #e6e6e6; font-size: 13px; outline: none;
  }
  select.g6-tool, button.g6-tool {
    background: #262a34; color: #e6e6e6; border: 1px solid #363b47; border-radius: 6px;
    padding: 6px 8px; font-size: 12px; cursor: pointer;
  }
  button.g6-tool:hover { background: #363b47; }
  button.g6-tool.active { background: #2E86AB; border-color: #2E86AB; }
  #g6Wrap { position: relative; background: #0e1117; flex: 1 1 auto; min-height: 0; }
  #g6Container { width: 100%; }
  #hint { color: #808495; font-size: 11px; padding: 3px 10px; }
  #perfBadge { font-size: 10.5px; color: #6f7893; padding: 2px 10px; }
  /* The whole #root (toolbar included) goes fullscreen - not just the canvas - so search,
     filters, viz selector, Page Fit, zoom and Reset Layout stay reachable while fullscreen. */
  #root:fullscreen { background: #0e1117; display: flex; flex-direction: column; width: 100vw; height: 100vh; }
  #root:fullscreen #g6Wrap { flex: 1 1 auto; min-height: 0; }
  /* #g6Container's height is normally an inline px value computed from the Streamlit iframe's
     embedded height (see render()/setFrameHeight) - that value has nothing to do with the real
     screen size, so once fullscreen it must stretch to fill #g6Wrap instead (the !important wins
     over the inline style; this rule stops applying - and the inline height takes back over -
     the instant :fullscreen no longer matches, i.e. immediately on exit). */
  #root:fullscreen #g6Container { width: 100% !important; height: 100% !important; }
  .tooltip {
    background: #1c212c !important; border: 1px solid #363b47 !important; border-radius: 6px !important;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45) !important; color: #e6e6e6 !important;
  }
</style>
</head>
<body>
<div id="root">
  <div id="toolbar">
    <input id="search" class="g6-search" type="text" placeholder="Search resources by name, type, or resource group..." />
    <select id="filterType" class="g6-tool"><option value="">All Types</option></select>
    <select id="filterHealth" class="g6-tool">
      <option value="">All Health</option>
      <option value="healthy">Healthy</option>
      <option value="warning">Warning</option>
      <option value="critical">Critical</option>
    </select>
    <select id="vizType" class="g6-tool" title="Visualization layout">
      <option value="hierarchical">Hierarchical</option>
      <option value="tree">Tree</option>
      <option value="network">Network</option>
      <option value="radial">Radial</option>
    </select>
    <button id="expandAll" class="g6-tool">Expand All</button>
    <button id="collapseAll" class="g6-tool">Collapse All</button>
    <button id="zoomIn" class="g6-tool" title="Zoom in">Zoom In</button>
    <button id="zoomOut" class="g6-tool" title="Zoom out">Zoom Out</button>
    <button id="fitView" class="g6-tool">Fit View</button>
    <button id="pageFitBtn" class="g6-tool" title="Recompute size and fit the whole graph into view (use after entering/exiting Full Screen)">Page Fit</button>
    <button id="resetLayoutBtn" class="g6-tool" title="Discard manually-moved node positions and restore the automatic layout">Reset Layout</button>
    <button id="fullscreenBtn" class="g6-tool">Full Screen</button>
    <button id="refreshBtn" class="g6-tool" title="Re-fetch Azure resources">&#8635; Refresh</button>
  </div>
  <div id="g6Wrap">
    <div id="g6Container"></div>
  </div>
  <div id="hint">Click a Resource Group / Type to expand or collapse it &middot; hover a resource to see its name, click to see its details and open its AI side panel &middot; drag a node to reposition it (use Reset Layout to undo) &middot; scroll to zoom &middot; drag background to pan</div>
  <div id="perfBadge"></div>
</div>
<script>
"use strict";

// --- Minimal vanilla-JS implementation of the Streamlit Components protocol -----------------
function sendMessageToStreamlit(type, data) {
  var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
  window.parent.postMessage(outData, "*");
}
function initStreamlit() { sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
function setFrameHeight(height) { sendMessageToStreamlit("streamlit:setFrameHeight", { height: height }); }
function setComponentValue(value) { sendMessageToStreamlit("streamlit:setComponentValue", { value: value }); }

var renderHandlers = [];
function onRender(fn) { renderHandlers.push(fn); }
window.addEventListener("message", function (event) {
  if (event.data.type === "streamlit:render") {
    renderHandlers.forEach(function (fn) { fn(event.data.args || {}); });
  }
});

// --- Resource type catalogue (curated) + ARM type normalization --------------------------------
// Same catalogue/approach as dashboard/components/reactflow_explorer and cytoscape_topology
// (kept in sync by hand - these are independently-vendored Streamlit components, so there's no
// shared module to import from without a build step).
var RESOURCE_TYPES = [
  { key: "subscription", name: "Subscription", color: "#2E86AB", icon: "🏢" },
  { key: "resource_group", name: "Resource Group", color: "#A23B72", icon: "📁" },
  { key: "app_service_plan", name: "App Service Plan", color: "#D4A017", icon: "📐" },
  { key: "app_service", name: "App Service", color: "#C73E1D", icon: "🌐" },
  { key: "static_web_app", name: "Static Web App", color: "#8E44AD", icon: "🕸" },
  { key: "aks_cluster", name: "AKS Cluster", color: "#F18F01", icon: "☸" },
  { key: "container_registry", name: "ACR (Container Registry)", color: "#2C3E50", icon: "🏗" },
  { key: "container_instance", name: "Container Instance", color: "#16A085", icon: "📦" },
  { key: "container_app", name: "Container App", color: "#1ABC9C", icon: "📦" },
  { key: "sql_database", name: "Azure SQL", color: "#06A77D", icon: "🗄" },
  { key: "cosmos_db", name: "Cosmos DB", color: "#2E9BD6", icon: "🌐" },
  { key: "storage_account", name: "Storage Account", color: "#6C757D", icon: "💾" },
  { key: "disk", name: "Managed Disk", color: "#7F8C8D", icon: "💽" },
  { key: "key_vault", name: "Key Vault", color: "#991B1B", icon: "🔐" },
  { key: "redis", name: "Redis", color: "#59C3C3", icon: "⚡" },
  { key: "postgresql", name: "PostgreSQL", color: "#336791", icon: "🐘" },
  { key: "mysql", name: "MySQL", color: "#4479A1", icon: "🐬" },
  { key: "application_insights", name: "Application Insights", color: "#7B2D8E", icon: "📊" },
  { key: "log_analytics", name: "Log Analytics", color: "#1F77B4", icon: "📋" },
  { key: "azure_monitor", name: "Azure Monitor", color: "#3498DB", icon: "📈" },
  { key: "vnet", name: "VNet", color: "#27AE60", icon: "🕸" },
  { key: "nsg", name: "NSG", color: "#C0392B", icon: "🛡" },
  { key: "load_balancer", name: "Load Balancer", color: "#E67E22", icon: "⚖" },
  { key: "application_gateway", name: "Application Gateway", color: "#D35400", icon: "🚪" },
  { key: "firewall", name: "Firewall", color: "#B03A2E", icon: "🧱" },
  { key: "bastion", name: "Bastion", color: "#5B2C6F", icon: "🔒" },
  { key: "vpn_gateway", name: "VPN/ExpressRoute Gateway", color: "#8E44AD", icon: "🔗" },
  { key: "public_ip", name: "Public IP", color: "#2980B9", icon: "📡" },
  { key: "network_interface", name: "Network Interface", color: "#5499C7", icon: "🔌" },
  { key: "private_endpoint", name: "Private Endpoint", color: "#48C9B0", icon: "🔒" },
  { key: "dns_zone", name: "DNS Zone", color: "#229954", icon: "🌐" },
  { key: "cdn_front_door", name: "CDN / Front Door", color: "#F39C12", icon: "🚀" },
  { key: "traffic_manager", name: "Traffic Manager", color: "#D68910", icon: "🚦" },
  { key: "virtual_machine", name: "Virtual Machine", color: "#0F6FC5", icon: "🖥" },
  { key: "availability_set", name: "Availability Set", color: "#2471A3", icon: "🖥" },
  { key: "vm_scale_set", name: "VM Scale Set", color: "#1A5276", icon: "🖥" },
  { key: "managed_identity", name: "Managed Identity", color: "#AF7AC5", icon: "🪪" },
  { key: "automation_account", name: "Automation Account", color: "#884EA0", icon: "🤖" },
  { key: "recovery_vault", name: "Recovery Services Vault", color: "#7D3C98", icon: "🛟" },
  { key: "api_management", name: "API Management", color: "#0E6655", icon: "🔀" },
  { key: "event_hub", name: "Event Hub", color: "#B9770E", icon: "📨" },
  { key: "service_bus", name: "Service Bus", color: "#9C640C", icon: "📨" },
  { key: "logic_app", name: "Logic App", color: "#2874A6", icon: "🔁" },
  { key: "function_app", name: "Function App", color: "#E67E22", icon: "λ" },
  { key: "data_factory", name: "Data Factory", color: "#138D75", icon: "🏭" },
  { key: "cognitive_services", name: "Cognitive Services", color: "#AF601A", icon: "🧠" },
  { key: "search_service", name: "Cognitive Search", color: "#186A3B", icon: "🔎" },
  { key: "gitlab_project", name: "GitLab Project", color: "#FC6D26", icon: "🦊" },
  { key: "pipeline", name: "Pipeline", color: "#E24329", icon: "⚙" },
  { key: "unknown", name: "Unknown", color: "#95A5A6", icon: "◆" }
];
var RESOURCE_TYPE_BY_KEY = {};
RESOURCE_TYPES.forEach(function (t) { RESOURCE_TYPE_BY_KEY[t.key] = t; });

// Ordered most-specific-first: matchArmType returns the first hit, so a narrow rule (e.g. a
// specific Microsoft.Web/staticSites) must precede any broader catch-all that would otherwise
// swallow it (e.g. a bare "microsoft.web/" or "microsoft.compute/").
var ARM_TYPE_RULES = [
  { match: "microsoft.resources/resourcegroups", key: "resource_group" },
  { match: "microsoft.web/serverfarms", key: "app_service_plan" },
  { match: "microsoft.web/staticsites", key: "static_web_app" },
  { match: "microsoft.web/sites/functions", key: "function_app" },
  { match: "microsoft.web/sites", key: "app_service" },
  { match: "microsoft.containerservice/managedclusters", key: "aks_cluster" },
  { match: "microsoft.containerregistry/registries", key: "container_registry" },
  { match: "microsoft.containerinstance/", key: "container_instance" },
  { match: "microsoft.app/", key: "container_app" },
  { match: "microsoft.documentdb/", key: "cosmos_db" },
  { match: "microsoft.sql/", key: "sql_database" },
  { match: "microsoft.dbforpostgresql/", key: "postgresql" },
  { match: "microsoft.dbformysql/", key: "mysql" },
  { match: "microsoft.cache/redis", key: "redis" },
  { match: "microsoft.storage/storageaccounts", key: "storage_account" },
  { match: "microsoft.compute/disks", key: "disk" },
  { match: "microsoft.keyvault/vaults", key: "key_vault" },
  { match: "microsoft.insights/components", key: "application_insights" },
  { match: "microsoft.operationalinsights/workspaces", key: "log_analytics" },
  { match: "microsoft.insights/", key: "azure_monitor" },
  { match: "microsoft.network/virtualnetworks", key: "vnet" },
  { match: "microsoft.network/networksecuritygroups", key: "nsg" },
  { match: "microsoft.network/loadbalancers", key: "load_balancer" },
  { match: "microsoft.network/applicationgateways", key: "application_gateway" },
  { match: "microsoft.network/azurefirewalls", key: "firewall" },
  { match: "microsoft.network/bastionhosts", key: "bastion" },
  { match: "microsoft.network/vpngateways", key: "vpn_gateway" },
  { match: "microsoft.network/virtualnetworkgateways", key: "vpn_gateway" },
  { match: "microsoft.network/expressroutecircuits", key: "vpn_gateway" },
  { match: "microsoft.network/publicipaddresses", key: "public_ip" },
  { match: "microsoft.network/networkinterfaces", key: "network_interface" },
  { match: "microsoft.network/privateendpoints", key: "private_endpoint" },
  { match: "microsoft.network/privatednszones", key: "dns_zone" },
  { match: "microsoft.network/dnszones", key: "dns_zone" },
  { match: "microsoft.network/trafficmanagerprofiles", key: "traffic_manager" },
  { match: "microsoft.cdn/", key: "cdn_front_door" },
  { match: "microsoft.compute/availabilitysets", key: "availability_set" },
  { match: "microsoft.compute/virtualmachinescalesets", key: "vm_scale_set" },
  { match: "microsoft.compute/virtualmachines", key: "virtual_machine" },
  { match: "microsoft.compute/", key: "virtual_machine" },
  { match: "microsoft.managedidentity/", key: "managed_identity" },
  { match: "microsoft.automation/", key: "automation_account" },
  { match: "microsoft.recoveryservices/", key: "recovery_vault" },
  { match: "microsoft.apimanagement/", key: "api_management" },
  { match: "microsoft.eventhub/", key: "event_hub" },
  { match: "microsoft.servicebus/", key: "service_bus" },
  { match: "microsoft.logic/", key: "logic_app" },
  { match: "microsoft.datafactory/", key: "data_factory" },
  { match: "microsoft.cognitiveservices/", key: "cognitive_services" },
  { match: "microsoft.search/", key: "search_service" }
];
function matchArmType(lowerKey) {
  for (var i = 0; i < ARM_TYPE_RULES.length; i++) {
    if (lowerKey.indexOf(ARM_TYPE_RULES[i].match) !== -1) return ARM_TYPE_RULES[i];
  }
  return null;
}
function prettyTypeName(rawType) {
  var seg = (rawType || "").split("/").pop() || rawType || "Unknown";
  seg = seg.replace(/[-_]/g, " ");
  return seg.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}
function hashColor(str) {
  var hash = 0;
  for (var i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) >>> 0; }
  return "hsl(" + (hash % 360) + ", 60%, 50%)";
}
var _typeMetaCache = {};
function typeMeta(rawType) {
  var lowerKey = (rawType || "unknown").toLowerCase();
  if (_typeMetaCache[lowerKey]) return _typeMetaCache[lowerKey];
  var meta;
  if (RESOURCE_TYPE_BY_KEY[lowerKey]) {
    meta = RESOURCE_TYPE_BY_KEY[lowerKey];
  } else {
    var rule = matchArmType(lowerKey);
    if (rule && RESOURCE_TYPE_BY_KEY[rule.key]) {
      meta = RESOURCE_TYPE_BY_KEY[rule.key];
    } else if (!lowerKey || lowerKey === "unknown") {
      meta = RESOURCE_TYPE_BY_KEY.unknown;
    } else {
      meta = { key: lowerKey, name: prettyTypeName(rawType), icon: "◆", color: hashColor(lowerKey) };
    }
  }
  _typeMetaCache[lowerKey] = meta;
  return meta;
}
function healthColor(status) {
  var s = (status || "").toLowerCase();
  if (["critical", "error", "failed", "stopped", "offline", "unavailable"].indexOf(s) !== -1) return "#e74c3c";
  if (["warning", "degraded", "unhealthy"].indexOf(s) !== -1) return "#f1c40f";
  if (["healthy", "running", "active", "online", "succeeded", "available"].indexOf(s) !== -1) return "#2ecc71";
  return "#5c6370";
}
function truncateLabel(text, maxLen) {
  text = text || "";
  return text.length > maxLen ? text.slice(0, maxLen - 1) + "…" : text;
}
// A resource node's fill used to be a flat near-black (#171b24, barely distinguishable from the
// page background) with only a thin border/icon carrying any color - the node body itself read as
// dim/lifeless. Tinting the fill with the resource's own type color (at low alpha, so the icon
// and border still stand out clearly on top) makes each node visibly brighter/more colorful
// without changing what color represents what type.
function hexToRgba(hex, alpha) {
  if (!hex || hex.charAt(0) !== "#" || hex.length < 7) return "rgba(255,255,255," + alpha + ")";
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

// --- Tree building: Subscription -> Resource Groups -> Resource Types -> Resources -------------
var SUBSCRIPTION_ID = "__subscription__";
function rgNodeId(rgName) { return "rg::" + rgName; }
function typeNodeId(rgName, typeKey) { return "rg::" + rgName + "::" + typeKey; }

function buildTree(resources, subscriptionLabel) {
  var byId = {};
  var parentOf = {};

  var rgOrder = [];
  var rgIndex = {};
  resources.forEach(function (r) {
    var rgName = r.resource_group || "(no resource group)";
    if (!rgIndex[rgName]) { rgIndex[rgName] = { name: rgName, resources: [] }; rgOrder.push(rgName); }
    rgIndex[rgName].resources.push(r);
  });

  var rgChildren = [];
  rgOrder.forEach(function (rgName) {
    var rgId = rgNodeId(rgName);
    var group = rgIndex[rgName];

    var typeOrder = [];
    var typeIndex = {};
    group.resources.forEach(function (r) {
      var meta = typeMeta(r.type);
      if (!typeIndex[meta.key]) { typeIndex[meta.key] = { meta: meta, resources: [] }; typeOrder.push(meta.key); }
      typeIndex[meta.key].resources.push(r);
    });

    var typeChildIds = [];
    typeOrder.forEach(function (typeKey) {
      var bucket = typeIndex[typeKey];
      var tId = typeNodeId(rgName, typeKey);
      var resourceChildIds = bucket.resources.map(function (r) {
        var rid = r.id || r.resource_id;
        byId[rid] = { id: rid, kind: "resource", label: r.name || rid, resource: r, count: 1, childIds: null };
        parentOf[rid] = tId;
        return rid;
      });
      byId[tId] = {
        id: tId, kind: "type", label: bucket.meta.name, meta: bucket.meta,
        count: resourceChildIds.length, childIds: resourceChildIds
      };
      parentOf[tId] = rgId;
      typeChildIds.push(tId);
    });

    byId[rgId] = {
      id: rgId, kind: "resource_group", label: rgName, count: group.resources.length,
      childIds: typeChildIds, resources: group.resources
    };
    parentOf[rgId] = SUBSCRIPTION_ID;
    rgChildren.push(rgId);
  });

  byId[SUBSCRIPTION_ID] = { id: SUBSCRIPTION_ID, kind: "subscription", label: subscriptionLabel, count: resources.length, childIds: rgChildren };

  return { byId: byId, parentOf: parentOf, rootId: SUBSCRIPTION_ID };
}

function ancestorChainOf(tree, nodeId) {
  var chain = [];
  var cur = tree.parentOf[nodeId];
  var guard = 0;
  while (cur && guard < 10) { chain.push(cur); cur = tree.parentOf[cur]; guard++; }
  return chain;
}

// --- Per-node visual style (fully resolved up front - no G6 style-mapper ambiguity) --------------
var NODE_SIZE = {
  subscription: [230, 54],
  resource_group: [210, 50],
  type: [190, 46],
  resource: [180, 44]
};

// "Network" renders every kind as a large, uniform circle instead of the tree-chrome rect
// (chevron/badge/dashed border) the other three layouts use - see styleForGroupNode/
// styleForResourceNode's `network` branch below.
var NETWORK_NODE_DIAMETER = { subscription: 30, resource_group: 28, type: 26, resource: 24 };

function groupMeta(node) {
  if (node.kind === "subscription") return RESOURCE_TYPE_BY_KEY.subscription;
  if (node.kind === "resource_group") return RESOURCE_TYPE_BY_KEY.resource_group;
  return node.meta;
}

// Hierarchical flows left-to-right (see LAYOUT_PRESETS.hierarchical's rankdir "LR") so its
// labels sit to the node's right instead of underneath - a below-node label would eat into the
// vertical gap between siblings stacked along that same axis. Tree/Radial keep the simpler
// bottom placement since they don't stack siblings along the label's axis.
function nonNetworkLabelPlacement() {
  return vizType === "hierarchical" ? "right" : "bottom";
}
// Matches the edge routing to the active flow direction: a vertical cubic curve looks bent and
// wrong on a left-to-right hierarchy, and vice versa for Tree's top-down flow.
function nonNetworkEdgeType() {
  return vizType === "hierarchical" ? "cubic-horizontal" : "cubic-vertical";
}

// `emphasized` marks a group node as an ancestor of the currently-selected resource (see
// highlightedAncestorNodeIdsFor) - a soft glow + slightly thicker border, never a fill/icon
// color change, so the relationship path is easy to follow without losing the type-identity
// coloring the rest of the graph relies on. `dimmed` marks it as unrelated to the current
// selection (irrelevant unless something is selected).
function styleForGroupNode(node, expanded, network, emphasized, dimmed) {
  var meta = groupMeta(node);
  if (network) {
    // Uniform, clean circular treatment: no chevron/badge chrome, label hidden by default
    // (see refreshZoomDependentLabels/computeVisibleG6Data), just a bigger node for anything
    // with more members so dense hubs read as visually more important.
    var diameter = (NETWORK_NODE_DIAMETER[node.kind] || NETWORK_NODE_DIAMETER.resource_group) + Math.min(10, Math.log(node.count + 1) * 2.2);
    return {
      size: diameter,
      fill: "rgba(255,255,255,0.06)",
      stroke: meta.color,
      lineWidth: emphasized ? 3.5 : 2,
      labelText: "",
      labelFill: "#e6e6e6",
      labelFontSize: 11,
      labelPlacement: "bottom",
      labelBackground: true,
      labelBackgroundFill: "rgba(14,17,23,0.75)",
      icon: true,
      iconText: meta.icon,
      iconFontFamily: "Segoe UI Emoji, Segoe UI Symbol, sans-serif",
      iconFill: meta.color,
      badge: false,
      opacity: dimmed ? 0.25 : 1,
      shadowColor: emphasized ? "rgba(255,107,107,0.6)" : undefined,
      shadowBlur: emphasized ? 14 : 0,
      cursor: "pointer"
    };
  }
  var chevron = expanded ? "▼" : "▶";
  return {
    size: NODE_SIZE[node.kind] || NODE_SIZE.resource_group,
    fill: "rgba(255,255,255,0.04)",
    stroke: meta.color,
    lineWidth: emphasized ? 3.5 : 2,
    lineDash: [4, 3],
    radius: 8,
    labelText: chevron + " " + truncateLabel(node.label, 24) + "  (" + node.count + ")",
    labelFill: "#e6e6e6",
    labelFontSize: 12,
    labelFontWeight: 600,
    labelPlacement: nonNetworkLabelPlacement(),
    icon: true,
    iconText: meta.icon,
    iconFontFamily: "Segoe UI Emoji, Segoe UI Symbol, sans-serif",
    iconFill: meta.color,
    badge: true,
    badges: [{ text: String(node.count), placement: "right-top", fill: "#ffffff", backgroundFill: meta.color }],
    opacity: dimmed ? 0.3 : 1,
    shadowColor: emphasized ? "rgba(255,107,107,0.5)" : undefined,
    shadowBlur: emphasized ? 12 : 0,
    cursor: "pointer"
  };
}

function styleForResourceNode(node, selected, matched, dimmed, network) {
  var r = node.resource;
  var meta = typeMeta(r.type);
  var border = selected ? "#FF6B6B" : healthColor(r.health_status);
  // Labels are intentionally omitted for most resources - with 800-1000+ resources, permanently
  // drawing every label both clutters the view and is expensive to lay out/measure. The name is
  // surfaced via the hover tooltip (see the "tooltip" plugin), on selection, on a search/filter
  // match, and once the user has zoomed in far enough that there's room to read them without
  // collisions (zoomLabelsVisible, refreshed by refreshZoomDependentLabels()).
  var showLabel = selected || matched || zoomLabelsVisible;
  if (network) {
    return {
      size: NETWORK_NODE_DIAMETER.resource,
      fill: hexToRgba(meta.color, 0.32),

// --- Visualization presets ----------------------------------------------------------------------

// Radial computes its own simple, deterministic sunburst-style polar layout: the root at the
// center, each depth level on its own ring, and each node's angular slice sized proportionally to
// its visible descendant count (so a Resource Group with many resources gets proportionally more

// already encode, with no separate clustering force needed), mild centering, and a final

    // of invoking the active layout algorithm (which would discard that arrangement and jump/

    return;

    if (selectedId) setComponentValue("__deselect__");
  });
  // Manual repositioning: once the user drops a node somewhere, remember that exact spot and stop
  // auto-relayouting (see hasManualLayout in rerender()) so the arrangement sticks.
  graph.on("node:dragend", function (evt) {
    var id = evt.target && evt.target.id;
    if (!id) return;
    try {
      var pos = graph.getElementPosition(id);
      if (!pos) return;
      nodePositions[id] = { x: pos[0], y: pos[1] };
      hasManualLayout = true;
    } catch (e) { /* element not resolvable (mid-transition) - ignore, drag simply didn't stick */ }
  });
  return graph;
}

// Re-runs layout only (no data re-fetch, no data rebuild) - all four visualizations share the
// exact same already-loaded resource tree/subset.
function applyLayout(vizKey) {
  if (VIZ_KEYS.indexOf(vizKey) === -1) vizKey = "hierarchical";
  vizType = vizKey;
  saveVizPreference(vizKey);
  // Manual positions only apply "while the current visualization remains active" - switching to
  // a different layout paradigm should go back to that layout's own automatic arrangement.
  hasManualLayout = false;
  nodePositions = {};
  var sel = document.getElementById("vizType");
  if (sel.value !== vizKey) sel.value = vizKey;
  if (!graph) return;
  // Rebuild the graph instance rather than reusing setData()/render() on the existing one:
  // switching a node's shape `type` (rect <-> circle - i.e. any transition into or out of
  // Network) on an already-rendered G6 v5 graph was observed to leave stale rendering artifacts
  // from the old shape (old dashed-rect chrome still showing at the new layout's positions, or a
  // blank canvas) instead of properly repainting as the new shape. A fresh instance side-steps
  // that entirely. This never touches `tree`/Azure data, only the rendering-layer graph object.
  var container = document.getElementById("g6Container");
  graph.destroy();
  graph = null;
  ensureGraph(container);
  // Same readability cap rerender() applies: switching into Network/Radial from a fully-expanded
  // Hierarchical/Tree view must not dump every expanded node into a force/radial layout - that's
  // exactly the dense spider-web/overlap this cap exists to prevent.
  var matches = computeMatches();
  enforceReadabilityCap(matches);
  var data = computeVisibleG6Data(matches);
  var renderStart = performance.now();
  if (vizKey === "radial" || vizKey === "network") {
    if (vizKey === "radial") applyRadialPositions(data); else applyNetworkPositions(data);
    graph.setData(data);
    Promise.resolve(graph.draw()).then(function () {
      console.log("[g6_explorer] G6 render (" + vizKey + "): " + (performance.now() - renderStart).toFixed(1) + "ms, " + data.nodes.length + " nodes");
      afterLayoutSettled();
    });
    return;
  }
  // graph.setLayout() only swaps the layout config synchronously (no Promise returned here,
  // unlike graph.render()) - re-running render() is what actually re-computes positions and
  // draws, using the exact same already-bound data. Node shape (rect vs circle) and edge type
  // depend on vizType too, so rebuild the data set, not just the layout.
  graph.setLayout(LAYOUT_PRESETS[vizKey]);
  graph.setData(data);
  graph.render().then(function () {
    console.log("[g6_explorer] G6 render (" + vizType + "): " + (performance.now() - renderStart).toFixed(1) + "ms, " + data.nodes.length + " nodes");
    afterLayoutSettled();
  });
}

// --- Toolbar wiring -------------------------------------------------------------------------
// Debounced: on a large expanded tree, rerender() can trigger a full relayout (dagre/dendrogram
// over hundreds of nodes) which blocks the main thread long enough to make typing itself feel
// unresponsive if it ran on every single keystroke. Waiting for a short pause in typing keeps the
// input itself always instant (that part is native browser behavior, unrelated to this handler)
// while still updating the graph promptly once the user stops typing.
var searchDebounceTimer = null;
document.getElementById("search").addEventListener("input", function (e) {
  var value = e.target.value;
  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(function () { search = value; rerender(); }, 220);
});
document.getElementById("filterType").addEventListener("change", function (e) { typeFilter = e.target.value; rerender(); });
document.getElementById("filterHealth").addEventListener("change", function (e) { healthFilter = e.target.value; rerender(); });
document.getElementById("vizType").addEventListener("change", function (e) { applyLayout(e.target.value); });
document.getElementById("expandAll").addEventListener("click", function () {
  Object.keys(tree.byId).forEach(function (id) { if (tree.byId[id].kind !== "resource") expandedIds.add(id); });
  rerender();
});
document.getElementById("collapseAll").addEventListener("click", function () {
  expandedIds.clear();
  expandedIds.add(SUBSCRIPTION_ID);
  rerender();
});
document.getElementById("fitView").addEventListener("click", function () {
  if (graph) graph.fitView({ padding: 40 });
});
document.getElementById("fullscreenBtn").addEventListener("click", function () {
  // The whole #root (toolbar + canvas) goes fullscreen, not just the canvas, so search, filters,
  // the viz selector, zoom, Page Fit, and Reset Layout all stay reachable while fullscreen.
  var el = document.getElementById("root");
  if (!document.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen(); }
  else if (document.exitFullscreen) document.exitFullscreen();
});
// Entering/exiting fullscreen changes the container's actual pixel size; autoResize picks that up,
// but the graph's existing zoom/pan is now wrong for the new size, so recompute and re-fit.
document.addEventListener("fullscreenchange", function () {
  if (!graph) return;
  setTimeout(function () {
    if (graph.resize) graph.resize();
    graph.fitView({ padding: 40, duration: 150 });
  }, 120);
});
document.getElementById("zoomIn").addEventListener("click", function () {
  if (graph) graph.zoomBy(1.25);
});
document.getElementById("zoomOut").addEventListener("click", function () {
  if (graph) graph.zoomBy(0.8);
});
document.getElementById("pageFitBtn").addEventListener("click", function () {
  if (!graph) return;
  // Distinct from Fit View: also forces a size recompute first, which is what's actually needed
  // right after toggling Full Screen (the canvas's pixel dimensions just changed).
  if (graph.resize) graph.resize();
  graph.fitView({ padding: 40 });
});
document.getElementById("resetLayoutBtn").addEventListener("click", function () {
  applyLayout(vizType); // clears manual positions (see applyLayout) and reruns the automatic layout
});
// A Streamlit custom component's reported value is sticky - it keeps returning the same value on
// every rerun until JS sends a new one. A fixed "__refresh__" string would make the Python side
// see the *same* refresh request forever and re-issue it on every single rerun (an infinite
// refetch loop - this is exactly what made Refresh look broken/slow). Appending a timestamp makes
// each click's value unique so Python can tell "a new click happened" from "still reporting the
// last one" and only act once per actual click.
document.getElementById("refreshBtn").addEventListener("click", function () { setComponentValue("__refresh__:" + Date.now()); });

function refreshTypeFilterOptions(resources) {
  var sel = document.getElementById("filterType");
  var seen = {}; var out = [];
  resources.forEach(function (r) {
    var meta = typeMeta(r.type);
    if (!seen[meta.key]) { seen[meta.key] = true; out.push(meta); }
  });
  out.sort(function (a, b) { return a.name.localeCompare(b.name); });
  var current = sel.value;
  sel.innerHTML = "";
  var allOpt = document.createElement("option"); allOpt.value = ""; allOpt.textContent = "All Types"; sel.appendChild(allOpt);
  out.forEach(function (t) {
    var opt = document.createElement("option");
    opt.value = t.key; opt.textContent = t.icon + " " + t.name;
    sel.appendChild(opt);
  });
  sel.value = current && seen[current] ? current : "";
}

// --- Mount + Streamlit wiring --------------------------------------------------------------------
var lastResetToken = 0;
function render(args) {
  var resources = args.resources || [];
  var subscriptionLabel = args.subscription_label || "Subscription";
  var height = args.height || 760;
  var incomingSelectedId = args.selected_id || null;
  var resetToken = args.reset_token || 0;

  var container = document.getElementById("g6Container");
  var containerHeight = Math.max(height - 70, 400);
  container.style.height = containerHeight + "px";

  ensureGraph(container);

  var resourcesKey = resources.length + ":" + (resources[0] ? (resources[0].id || resources[0].resource_id) : "");
  var isNewDataset = resourcesKey !== lastResourcesKey;
  // The Refresh button bumps reset_token even when the re-fetched data is identical (same
  // length/first id, so isNewDataset alone wouldn't catch it) - Refresh is supposed to also
  // undo the user's expand/drag exploration and return to the pristine initial view, not just
  // silently re-fetch underneath whatever they'd expanded/dragged.
  var forcedReset = resetToken !== lastResetToken;
  lastResetToken = resetToken;

  if (isNewDataset || forcedReset) {
    var transformStart = performance.now();
    tree = buildTree(resources, subscriptionLabel);
    console.log("[g6_explorer] data transformation (buildTree): " + (performance.now() - transformStart).toFixed(1) + "ms for " + resources.length + " resources");
    expandedIds = new Set([SUBSCRIPTION_ID]);
    // A fresh dataset invalidates any manual arrangement from the previous one.
    hasManualLayout = false;
    nodePositions = {};
    // Small subscriptions get the friendlier "RGs pre-expanded" overview; large ones (the
    // 800-1000 resource case) start collapsed to just the subscription root so the first paint
    // is a compact, meaningful overview instead of hundreds of nodes at once.
    if (resources.length <= LARGE_DATASET_THRESHOLD) {
      tree.byId[SUBSCRIPTION_ID].childIds.forEach(function (rgId) { expandedIds.add(rgId); });
    }
    refreshTypeFilterOptions(resources);
    lastResourcesKey = resourcesKey;
  }

  selectedId = incomingSelectedId;
  if (selectedId !== lastSelectedIdArg) {
    lastSelectedIdArg = selectedId;
    if (selectedId && tree.byId[selectedId]) expandAncestorsOf(selectedId);
  }

  rerender();

  setFrameHeight(height);
}

document.getElementById("vizType").value = vizType;
onRender(render);
initStreamlit();
setFrameHeight(760);
</script>
</body>
</html>
